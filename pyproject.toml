[project]
name = "ag-vis"
version = "0.1.0"
description = "Animated visualization for AI agent activity"
requires-python = ">=3.12,<3.13"
dependencies = [
]

[project.optional-dependencies]
laya = ["laya==0.3.4"]

[project.scripts]
ag-vis = "ag_vis.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ag_vis"]
